# ===================================================================
# Spring Boot configuration for the "sit" profile (K8s / SIT namespace).
# Overrides base: points to in-cluster service names, enables Liquibase
# with demo data, enables debug logging.
# ===================================================================

spring:
  liquibase:
    contexts: demo

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: INFO
    liquibase: INFO

iqkv:
  db:
    host: ${DB_HOST:postgres-cms}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-cms}
  messaging:
    rabbitmq:
      enabled: true
  liquibase:
    bootstrap-tenants:
      - acme0001
      - demo0001

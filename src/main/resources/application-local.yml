# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: enables Liquibase with demo data, relaxes actuator,
# enables debug logging.
# Run infrastructure with: docker compose up postgres-cms rabbitmq-cms
# ===================================================================

spring:
  liquibase:
    contexts: demo

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

iqkv:
  messaging:
    rabbitmq:
      enabled: true
  liquibase:
    demo-tenants:
      - platform
      - acme0001
      - demo0001
